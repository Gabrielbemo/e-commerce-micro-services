services:
  postgres:
    container_name: ms_pg_sql
    image: postgres
    environment:
      POSTGRES_USER: gabriel
      POSTGRES_PASSWORD: gabriel
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5050:80
    networks:
      - microservices-net
    restart: unless-stopped

  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    networks:
      - microservices-net

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.53.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - microservices-net
    restart: unless-stopped

  loki:
    container_name: loki
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - microservices-net
    restart: unless-stopped

  promtail:
    container_name: promtail
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-data:/tmp
    networks:
      - microservices-net
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
      - loki
      - zipkin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - microservices-net
    restart: unless-stopped

  keycloak:
    container_name: keycloak-ms
    image: quay.io/keycloak/keycloak:24.0.2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://keycloak-ms:8080
      KC_HOSTNAME_ADMIN_URL: http://keycloak-ms:8080
      KC_HOSTNAME_STRICT: false
    command: "start-dev"
    ports:
      - "9098:8080"
    networks:
      microservices-net:
        aliases:
          - keyclock-ms
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"

  mongodb:
    container_name: ms_mongo_db
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=gabriel
      - MONGO_INITDB_ROOT_PASSWORD=gabriel
    volumes:
      - mongo:/data/db
    ports:
      - 27017:27017
    restart: unless-stopped
    networks:
      - microservices-net

  mongo-express:
    container_name: ms_mongo_express
    image: mongo-express
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=gabriel
      - ME_CONFIG_BASICAUTH_PASSWORD=gabriel
      - ME_CONFIG_MONGODB_ADMINUSERNAME=gabriel
      - ME_CONFIG_MONGODB_ADMINPASSWORD=gabriel
      - ME_CONFIG_MONGODB_URL=mongodb://gabriel:gabriel@ms_mongo_db:27017
    ports:
      - 8081:8081
    networks:
      - microservices-net
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    ports:
      - 22181:2181
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: ms_kafka
    ports:
      - 9092:9092
    depends_on:
      - zookeeper
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ms_kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - microservices-net

  mail-dev:
    container_name: ms_mail_dev
    image: maildev/maildev
    ports:
      - 1025:1025
      - 1080:1080
    networks:
      - microservices-net

  config-server:
    container_name: config-server
    build:
      context: ./services/config-server
    ports:
      - "8888:8888"
    depends_on:
      - postgres
      - pgadmin
      - zipkin
      - keycloak
      - mongodb
      - mongo-express
      - zookeeper
      - kafka
      - mail-dev
    networks:
      - microservices-net
    restart: unless-stopped

  discovery-service:
    container_name: discovery-service
    build:
      context: ./services/discovery
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - microservices-net
    restart: unless-stopped

  product-service:
    container_name: product-service
    build:
      context: ./services/product
    ports:
      - "8050:8050"
    depends_on:
      - discovery-service
    networks:
      - microservices-net
    restart: unless-stopped

  customer-service:
    container_name: customer-service
    build:
      context: ./services/customer
    ports:
      - "8090:8090"
    depends_on:
      - product-service
    networks:
      - microservices-net
    restart: unless-stopped

  payment-service:
    container_name: payment-service
    build:
      context: ./services/payment
    ports:
      - "8060:8060"
    depends_on:
      - product-service
    networks:
      - microservices-net
    restart: unless-stopped

  order-service:
    container_name: order-service
    build:
      context: ./services/order
    ports:
      - "8070:8070"
    depends_on:
      - product-service
    networks:
      - microservices-net
    restart: unless-stopped

  notification-service:
    container_name: notification-service
    build:
      context: ./services/notification
    ports:
      - "8040:8040"
    depends_on:
      - product-service
    networks:
      - microservices-net
    restart: unless-stopped

  gateway-server:
    container_name: gateway-server
    build:
      context: ./services/gateway-server
    ports:
      - "8222:8222"
    depends_on:
      - config-server
      - discovery-service
      - product-service
      - customer-service
      - payment-service
      - order-service
      - notification-service
    networks:
      - microservices-net
    restart: unless-stopped

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  mongo:
  kafka-data:
  zookeeper-data:
  prometheus-data:
  loki-data:
  grafana-data:
  promtail-data:
