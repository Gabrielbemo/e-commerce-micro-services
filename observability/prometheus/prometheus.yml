global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: gateway-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway-server:8222

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - product-service:8050

  - job_name: customer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - customer-service:8090

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - order-service:8070

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-service:8060

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8040

  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - discovery-service:8761

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:8888
